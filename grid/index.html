<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHUTTER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
        <link rel="shortcut icon" href="images/icons8-s-67.png" type="image/x-icon">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            font-family: Arial, sans-serif;
            color: white;
        }

         .sidebar {
            width: 300px;
            height: 100vh;
            background-color: black;
            position: fixed;
            right: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 35px;
            z-index: 10;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 50px;
        }

        .navbar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 27px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .navbar a:hover,
        .navbar a.active {
            color: #ff4b4b;
        }

      

        .social {
            display: flex;
            gap: 27px;
            margin-top: 60px;
        }

        .social a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 17px;
        }

        .social a:hover {
            color: #ff4b4b;
        }

    

        .gallery {
            width: calc(100% - 300px);
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 27px;
        }

        .item {
            height: 375px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: 0.5s;
        }

       

        .item:hover img {
            transform: scale(1.08);
            filter: brightness(60%);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: 0.4s;
        }

        .item:hover .overlay {
            opacity: 1;
        }

        .overlay h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .overlay p {
            font-size: 14px;
            color: #ddd;
        }

       
        .item1 {
            grid-column: span 4;
        }

        .item2 {
            grid-column: span 2;
        }

        .item3 {
            grid-column: span 2;
        }

        .item4 {
            grid-column: span 3;
        }

        .item5 {
            grid-column: span 1;
        }

        .item6 {
            grid-column: span 3;
        }

        .item7 {
            grid-column: span 3;
        }

        .item8 {
            grid-column: span 2;
        }

         .copyright {
            text-align: center;
            border-top: 1px solid #333;
            margin-top: 50px;
            padding-top: 25px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

   

    <div class="sidebar">

        <h2 class="logo">SHUTTER</h2>

        <nav class="navbar">
            <a href="#" class="active">HOME</a>
            <a href="#">PHOTOS</a>
            <a href="#">BIO</a>
            <a href="#">BLOG</a>
            <a href="#">CONTACT</a>
        </nav>

        <div class="social">
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-linkedin"></i></a>
            <a href="#"><i class="fa-brands fa-github"></i></a>
        </div>

    </div>


   

    <div class="gallery">

        <div class="item item1">
            <img src="./images/img_1" alt="Surfing">
            <div class="overlay">
                <h3>Photos Title Here</h3>
                <p>42 PHOTOS</p>
            </div>
        </div>

        <div class="item item2">
            <img src="./images/img_2" alt="Nature">
            <div class="overlay">
                <h3>Photos Title Here</h3>
                <p>35 PHOTOS</p>
            </div>
        </div>

        <div class="item item3">
            <img src="./images/img_3" alt="Portrait">
            <div class="overlay">
                <h3>Photos Title Here</h3>
                <p>25 PHOTOS</p>
            </div>
        </div>

        <div class="item item4">
            <img src="./images/img_4" alt="Mountain">
            <div class="overlay">
                <h3>Photos Title Here</h3>
                <p>30 PHOTOS</p>
            </div>
        </div>

        <div class="item item5">
            <img src="./images/img_5" alt="Friends">
            <div class="overlay">
                <h3>Photos Title Here</h3>
                <p>20 PHOTOS</p>
            </div>
        </div>

        <div class="item item6">
            <img src="./images/img_6.avif" alt="Landscape">
            <div class="overlay">
                <h3>Photos Title Here</h3>
                <p>40 PHOTOS</p>
            </div>
        </div>

        <div class="item item7">
            <img src="./images/img_7.avif" alt="Ocean">
            <div class="overlay">
                <h3>Photos Title Here</h3>
                <p>32 PHOTOS</p>
            </div>
        </div>


    </div>

    <footer>
         <div class="copyright">

            © 2026 Industry. All Rights Reserved.

        </div>
    </footer>

</body>

</html>
